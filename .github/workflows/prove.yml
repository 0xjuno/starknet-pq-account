name: recovery proof

# Proves and verifies the recovery program with Stwo for the public test mnemonic
# (recovery/args/braavos.json). Never point this at a real seed: Stwo is not zero-knowledge.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["recovery/**", ".github/workflows/prove.yml"]

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Add swap
        run: |
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          nproc; free -m
      - name: Prove (Braavos profile)
        working-directory: recovery
        run: /usr/bin/time -v scarb prove --execute --arguments-file args/braavos.json
      - name: Verify
        working-directory: recovery
        run: |
          scarb verify --execution-id 1
          ls -l target/execute/pq_recovery/execution1/proof/
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-proof-braavos
          path: recovery/target/execute/pq_recovery/execution1/proof/
