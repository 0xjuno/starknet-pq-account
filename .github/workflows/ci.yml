# Job names here are the required checks in scripts/merge.mjs (REQUIRED_CHECKS) and in the branch
# protection rule: contracts, falcon-differential, pf04-budgets, recovery, secrets, lint.
# The same checks locally: CONTRIBUTING.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Candidate crates match baseline + pinned patches
        run: vendor/provably-fast/falcon-512/make_crates.sh --check
      - name: Build
        working-directory: contracts
        run: scarb build
      - name: Test
        working-directory: contracts
        run: scarb cairo-test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kit verifier-switch gates
        working-directory: signer
        run: npm install --no-package-lock --no-audit --no-fund && node verifier_switch_check.mjs && node verifiers_check.mjs
      - name: Built classes match the release manifest
        run: node scripts/release_manifest.mjs --check
      - name: docs/index.html is built from its template
        run: node scripts/build_page.mjs --check
      # Exact count (==), last summary block only. Runs the tests again on the cached build: a
      # deleted or ignored test fails here even when the rest passes.
      - name: Test count is exact (scripts/cairo_tests.mjs)
        run: node scripts/cairo_tests.mjs contracts

  falcon-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Baseline and candidate verifiers agree with the reference on every vector
        run: bench/pf03/run.sh

  pf04-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - uses: foundry-rs/setup-snfoundry@v5
        with:
          starknet-foundry-version: "0.59.0"
      # setup-snfoundry installs the latest universal-sierra-compiler; pin the one budgets.json
      # was measured with (it compiles the test classes, so it changes gas).
      - uses: software-mansion/setup-universal-sierra-compiler@v1
        with:
          universal-sierra-compiler-version: "2.10.3"
      - name: Account-level gas, class sizes and libfuncs within network limits and budgets
        run: bench/pf04/run.sh --check

  recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"
      - name: Test
        working-directory: recovery
        run: scarb cairo-test
      - name: Execute (Braavos profile, public test mnemonic)
        working-directory: recovery
        run: scarb execute --arguments-file args/braavos.json --print-program-output --print-resource-usage --target bootloader --output none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test count is exact (scripts/cairo_tests.mjs)
        run: node scripts/cairo_tests.mjs recovery

  # Secrets, two layers with one gitleaks binary pinned by version and checksum (the release's
  # gitleaks_8.30.1_checksums.txt, linux_x64): (1) the commits this run adds, (2) the whole tree
  # that results, which also covers content that only appears in a merge commit. Rules:
  # .gitleaks.toml; reviewed public test vectors, one fingerprint each: .gitleaksignore.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get gitleaks (checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: gitleaks git (commits this run adds)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new ref has no "before": scan everything reachable from the pushed commit
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}" ;; esac
          /tmp/gitleaks git . --no-banner --redact -c .gitleaks.toml --log-opts="$RANGE"
      - name: gitleaks dir (resulting tree)
        run: /tmp/gitleaks dir . --no-banner --redact -c .gitleaks.toml

  # Rules for every change, with nothing to install (scripts/check.mjs, rules/rules.md): the rules
  # checker's self-test first, then the rules on the tracked files and on the messages of the
  # commits this run adds (S3), the merge and test-count judges' self-tests, the docs page and
  # candidate-crate --check scripts.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checks (scripts/check.mjs)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check.mjs --commits "$RANGE"
